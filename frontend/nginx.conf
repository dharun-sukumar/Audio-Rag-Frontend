server {
    listen 80;
    server_name transcribe.alterwork.in;
    
    root /var/www/transcribe.alterwork.in;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets (but not HTML)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't cache HTML files - always check for updates
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Increase max body size for file uploads (400MB)
    client_max_body_size 400M;

    # API proxy: /api/* -> backend at 38.242.215.255:8000
    location /api {
        # Only add trailing slash for /api/conversations (which requires it)
        rewrite ^/api/conversations$ /conversations/ break;
        
        # Match all other /api paths -> just strip /api prefix
        rewrite ^/api(/.*)$ $1 break;

        # Forward to backend
        # No trailing slash here because we use rewrites above
        proxy_pass http://38.242.215.255:8000;
        proxy_http_version 1.1;
        
        # Important: Use the backend's IP/Port as the Host header
        proxy_set_header Host 38.242.215.255:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Serve React app - handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
}
