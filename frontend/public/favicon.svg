<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="18" fill="#10a37f"/>
  
  <!-- Speech bubble icon (scaled and centered) -->
  <g transform="translate(26, 26) scale(2.5)">
    <!-- Speech bubble outline -->
    <path d="M12 3C7.5 3 4 6.5 4 10.5C4 14.5 7.5 18 12 18C12 18 12 21 12 21C12 21 17 17 17 17C19.5 15.5 21 13 21 10.5C21 6.5 17.5 3 12 3Z" 
          fill="none" 
          stroke="white" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Three dots inside speech bubble -->
    <circle cx="9" cy="10" r="1.2" fill="white"/>
    <circle cx="12" cy="10" r="1.2" fill="white"/>
    <circle cx="15" cy="10" r="1.2" fill="white"/>
  </g>
</svg>
